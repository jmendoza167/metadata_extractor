name: tests

on:
  push:
    branches: ["**"]  # tags run these jobs through release.yml instead
  pull_request:
  workflow_call:  # used by release.yml

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

  package:
    name: build and check the packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      # The published files are built only with tools pinned by hash, in this
      # environment (no isolated build environment downloading the newest
      # setuptools); nothing else is installed before they are uploaded.
      - name: Install the build tools (pinned by hash)
        run: python -m pip install --require-hashes --no-deps -r .github/build-requirements.txt

      - name: Build sdist and wheel
        run: python -m build --no-isolation --outdir dist .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # After the upload, so twine (and what it installs) can't change the
      # files that are published; the release still waits for this check.
      - name: twine check
        run: |
          python -m pip install "twine==7.0.0"
          python -m twine check --strict dist/*

  package-install:
    name: installed wheel on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      # only for scripts/check_wheel.py and the samples; the check runs the
      # installed program from a temporary folder and fails if metaex is
      # imported from anywhere but the new venv
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install the wheel in a fresh venv and try it
        run: python scripts/check_wheel.py dist/metaex-*-py3-none-any.whl tests/samples
