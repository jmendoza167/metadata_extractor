name: release

# A pushed tag vX.Y.Z publishes that version to PyPI (after approval in the
# "pypi" environment) and creates a GitHub Release. Publishing uses PyPI
# Trusted Publishing (OIDC): there is no API token anywhere. See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  tests:
    name: tests and packages
    # the full test matrix, the build (once: the "dist" artifact that is
    # published below) and the installed-wheel check on every OS
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  check:
    name: check version and notes
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0  # the history of main too, for the check below

      # Only what is on main is released: a tag pushed on any other commit
      # (another branch, or a commit not on any branch) stops here.
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit $GITHUB_SHA is not on main; tag a commit of main"
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Tag equals the package version, CHANGELOG section is dated
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py --dist dist --tag "$TAG" --out notes.md

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/metaex/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release (with the built-in, short-lived GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py --dist dist --tag "$TAG" --out notes.md

      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "metaex ${TAG#v}"
          --notes-file notes.md
          --verify-tag
