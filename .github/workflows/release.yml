name: release

# A pushed tag vX.Y.Z publishes that version to PyPI and creates a GitHub
# Release. Running the workflow by hand (workflow_dispatch) is a dry run that
# publishes to TestPyPI instead. Publishing uses PyPI Trusted Publishing
# (OIDC): there is no API token anywhere. See RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: tests and packages
    # the full test matrix, the build (once: the "dist" artifact that is
    # published below) and the installed-wheel check on every OS
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  check:
    name: check version and notes
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Tag equals the package version, CHANGELOG section is dated
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py --dist dist --tag "$TAG" --out notes.md

      - name: Dry run checks (the CHANGELOG may still say Unreleased)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/release_notes.py --dist dist --out notes.md

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/metaex/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  publish-testpypi:
    name: publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/metaex/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release (with the built-in, short-lived GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py --dist dist --tag "$TAG" --out notes.md

      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "metaex ${TAG#v}"
          --notes-file notes.md
          --verify-tag
