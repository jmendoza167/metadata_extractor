[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metaex"
version = "0.0.1"
description = "View and remove metadata from files, using only the Python standard library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "Pillow>=11.0", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0",
       "mutagen>=1.47"]

[project.scripts]
metaex = "metaex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
