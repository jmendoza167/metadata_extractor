[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metaex"
dynamic = ["version"]  # from metaex.__version__ (src/metaex/__init__.py), the one place
description = "Show and remove metadata from photos, documents, audio and archives, using only the Python standard library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jmendoza167" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["metadata", "privacy", "exif", "gps", "xmp", "id3", "strip", "remove metadata",
            "anonymize", "jpeg", "png", "docx", "mp3", "zip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Office/Business",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jmendoza167/metadata_extractor"
Issues = "https://github.com/jmendoza167/metadata_extractor/issues"
Changelog = "https://github.com/jmendoza167/metadata_extractor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "Pillow>=11.0", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0",
       "mutagen>=1.47"]

[project.scripts]
metaex = "metaex.cli:main"

[tool.setuptools.dynamic]
version = { attr = "metaex.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
